<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maik Bauer – Visitenkarte</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #e9e5df;
    color: #252525;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.card {
    width: 100%;
    max-width: 420px;
    background: #f8f6f2;
    border-radius: 28px;
    padding: 38px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    animation: fadeIn 0.6s ease;
}

.logo {
    width: 65px;
    height: 65px;
    border: 1px solid #d2ccc2;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    letter-spacing: 2px;
    margin-bottom: 35px;
    color: #71685c;
}

.label {
    font-size: 11px;
    letter-spacing: 3px;
    color: #9b9489;
    text-transform: uppercase;
    margin-bottom: 15px;
}

h1 {
    font-size: 38px;
    font-weight: 500;
    line-height: 1.1;
    margin: 0;
    letter-spacing: -1px;
}

.subtitle {
    color: #8b847a;
    margin-top: 12px;
    font-size: 15px;
}

.line {
    width: 45px;
    height: 2px;
    background: #b7aa98;
    margin: 32px 0;
}
.contact {
    margin-bottom: 25px;
}

.contact-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: #a49c91;
    margin-bottom: 8px;
}

.contact-value {
    font-size: 16px;
    color: #333;
}

.buttons {
    margin-top: 35px;
}

.button {
    display: block;
    text-decoration: none;
    text-align: center;
    padding: 16px;
    border-radius: 14px;
    margin-top: 12px;
    font-size: 14px;
    font-weight: 500;
    transition: 0.2s;
}

.primary {
    background: #292929;
    color: white;
}

.secondary {
    background: #e9e5df;
    color: #292929;
}

.button:active {
    transform: scale(0.98);
}

.footer {
    text-align: center;
    margin-top: 30px;
    font-size: 10px;
    letter-spacing: 2px;
    color: #b0a89d;
    text-transform: uppercase;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">MB</div>

    <div class="label">Personal Contact</div>

    <h1>Maik Bauer</h1>

    <div class="subtitle">Digital Business Card</div>

    <div class="line"></div>

    <div class="contact">
        <div class="contact-label">TELEFON</div>
        <div class="contact-value">0176 43592351</div>
    </div>

    <div class="contact">
        <div class="contact-label">E-MAIL</div>
        <div class="contact-value">maik_2002@gmx.de</div>
    </div>

    <div class="buttons">

        <a class="button primary" href="maik-bauer.vcf">
            Kontakt speichern
        </a>

        <a class="button secondary" href="tel:017643592351">
            Anrufen
        </a>

        <a class="button secondary" href="mailto:maik_2002@gmx.de">
            E-Mail schreiben
        </a>

    </div>

    <div class="footer">
        Digital • Simple • Personal
    </div>

</div>

</body>
</html>
